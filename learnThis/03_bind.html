<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function foo() {
        console.log('foo函数被调用,this:', this);
      }

      const obj = {
        name: 'obj'
      };

      // 需求：调用foo函数时，this指向obj对象。
      // 同时，不希望obj对象中有foo方法。

      // bind方法
      // bind方法会创建一个新的绑定函数
      // 该函数在调用时，其this值会被设置为bind方法的第一个参数。
      const boundFoo = foo.bind(obj);
      boundFoo();

      // bind方法的参数传递
      function add(a, b) {
        console.log('a:', a);
        console.log('b:', b);
        return a + b;
      }

      // bind方法的参数传递
      // bind方法的第一个参数是函数执行时的this指向
      // 后续参数是传递给函数的参数。
      const boundAdd = add.bind(null, 1);
      console.log(boundAdd(2)); // 输出 3
    </script>
  </body>
</html>
