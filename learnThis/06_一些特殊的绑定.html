<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      var obj1 = {
        name: 'obj1',
        foo: function () {
          console.log('foo函数被调用,this:', this);
        }
      };
      var obj2 = {
        name: 'obj2'
      };

      obj2.foo = obj1.foo;
      obj2.foo(); // this->obj2

      // 独立函数调用
      (obj2.foo = obj1.foo)(); // this->window
    </script>
  </body>
</html>
