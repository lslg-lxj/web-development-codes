<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // const obj = {
      //   name: '张三',
      //   age: 18
      // };
      const obj = {
        _name: '张三',
        // obj对象的name属性是一个访问器属性，访问器属性的get和set方法中的this指向obj对象
        set name(newValue) {
          console.log('this:', this);
          // this指向源对象，所以这里是对源对象的操作
          this._name = newValue;
        },
        get name() {
          return this._name;
        }
      };

      // 设置name属性的值时，实际上是调用了obj对象的name属性的set方法
      obj.name = '李四';

      const objProxy = new Proxy(obj, {
        get: function (target, key, newValue, receiver) {
          // target[key] = newValue;
          console.log('proxy中get方法调用');

          // 通过Reflect.get()方法来获取目标对象的属性值
          return Reflect.get(target, key, receiver);
        },
        set: function (target, key, newValue, receiver) {
          // target[key] = newValue;
          // Reflect的优点：
          // 1.代理对象的目的：不再直接操作源对象
          // 2.Reflect.set()方法返回一个布尔值，表示设置属性是否成功
          // 3.Reflect可以设置receiver参数，表示设置属性的对象是谁(this指向)，默认target对象
          console.log('proxy中set方法调用');
          console.log('receiver:', receiver);

          // 通过Reflect.set()方法来设置目标对象的属性值
          const isSuccess = Reflect.set(target, key, newValue);
          if (!isSuccess) {
            throw new Error(`设置属性${key}失败`);
          }
          return isSuccess;
        }
      });

      // 同理，设置objProxy对象的name属性的值时
      // 实际上是调用了objProxy对象的name属性的set方法
      objProxy.name = '李四';
    </script>
  </body>
</html>
