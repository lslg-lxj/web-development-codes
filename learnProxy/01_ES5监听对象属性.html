      // 2.遍历所有的属性

      const keys = Object.keys(obj);
      // 块级作用域（闭包）
      for (const key of keys) {
        let value = obj[key];
        Object.defineProperty(obj, key, {
          // 描述符：访问器
          set: function (newValue) {
            console.log(`给${key}设置了新的值`, newValue);
            value = newValue;
          },
          get: function (newValue) {
            console.log(`监听：获取${key}的值`);
            return value;
          }
        });
      }
