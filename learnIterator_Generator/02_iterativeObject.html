<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // info本身不可迭代
      const info = {
        friends: ['张三', '李四', '王五', '赵六'],
        numbers: [1, 2, 3, 4, 5]
      };

      // 1.给info创建一个迭代器，迭代Info对象中的friends数组
      let index = 0;
      const infoIterator = {
        next: function () {
          if (index < info.friends.length) {
            return { value: info.friends[index++], done: false };
          } else {
            return { value: undefined, done: true };
          }
        }
      };
      console.log(infoIterator.next());
      console.log(infoIterator.next());
      console.log(infoIterator.next());
      console.log(infoIterator.next());
      console.log(infoIterator.next());

      // 可以把迭代器合并到对象中
      // 此时info1对象就变成了一个可迭代对象

      // 1.必须实现一个Symbol.iterator属性，值是一个函数
      // 2.函数返回一个迭代器对象(用于迭代当前对象)
      const info1 = {
        friends: ['张三', '李四', '王五', '赵六'],
        [Symbol.iterator]: function () {
          let index = 0;
          return {
            next: function () {
              if (index < info1.friends.length) {
                return { value: info1.friends[index++], done: false };
              } else {
                return { value: undefined, done: true };
              }
            }
          };
        }
      };

      // info1[Symbol.iterator]; // 拿到一个函数
      // info1[Symbol.iterator](); // 函数调用
      const iterator = info1[Symbol.iterator](); // 拿到迭代器对象
      console.log(iterator.next());

      // 可迭代对象具备下面的特点：
      // 可迭代对象可以进行类似for...of的迭代
      for (const item of info1) {
        console.log(item); // 张三 李四 王五 赵六
      }

      // 数组是一个可迭代对象，实现原理就是Symbol.iterator
      const arr = [1, 2, 3, 4, 5];
      console.log(arr[Symbol.iterator]());

      const arrIterator = arr[Symbol.iterator]();
      console.log(arrIterator.next());

      //优化:使代码具有可复用性
      const info2 = {
        friends: ['张三', '李四', '王五', '赵六'],
        [Symbol.iterator]: function () {
          let index = 0;
          return {
            // 改造：使用箭头函数
            // this指向info2对象，箭头函数没有this，this指向外层作用域
            next: () => {
              if (index < this.friends.length) {
                return { value: this.friends[index++], done: false };
              } else {
                return { value: undefined, done: true };
              }
            }
          };
        }
      };

      console.log('----------------');
      // 迭代info对象中的键值对
      const info3 = {
        name: '张三',
        age: 18,
        gender: '男',
        [Symbol.iterator]: function () {
          // this指向info3对象
          // const keys = Object.keys(this);
          const entries = Object.entries(this);
          let index = 0;

          return {
            // next: () => {
            //   if (index < keys.length) {
            //     const key = keys[index++];
            //     return { value: [key, this[key]], done: false };
            //   } else {
            //     return { value: undefined, done: true };
            //   }
            // }

            next: () => {
              if (index < entries.length) {
                return { value: entries[index++], done: false };
              } else {
                return { value: undefined, done: true };
              }
            }
          };
        }
      };

      for (const item of info3) {
        console.log(item);
      }
    </script>
  </body>
</html>
