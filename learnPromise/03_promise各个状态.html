<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // 1.创建一个promise
      const promise = new Promise((resolve, reject) => {
        // 立即执行
        // 1.初始状态：待定状态
        console.log('当前处于pending状态');

        // 2.执行resolve时，处于fulfilled状态(兑现状态)
        // 调用resolve,那么then方法中的第一个回调函数就会被调用
        resolve('成功的回调');

        // 3.执行reject时，处于rejected状态（拒绝状态）
        // 调用reject,那么catch方法中的回调函数就会被调用
        reject('失败的回调');

        // Note: Promise的状态一旦改变就不能再改变了
        // 状态只能从pending变为fulfilled或者rejected
      });

      // 2.监听promise的状态
      promise
        .then((value) => {
          console.log('成功的回调');
        })
        .catch((error) => {
          console.log('失败的回调');
        });
    </script>
  </body>
</html>
