<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      const promise = new Promise((resolve, reject) => {
        console.log('pending');
        resolve('成功的回调');
        // reject('失败的回调');
      });

      promise
        .then((res) => {
          console.log('res:', res);
        })
        .catch((error) => {
          console.log('error:', error);
        })
        // finally方法的回调函数不接收任何参数
        // finally方法的回调函数会在promise对象决议后执行，无论是成功还是失败
        .finally(() => {
          console.log('finally方法的回调');
        });
    </script>
  </body>
</html>
