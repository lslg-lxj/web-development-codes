<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      const promise = new Promise((resolve, reject) => {
        // 这里的resolve是对当前这个promise对象进行决议
        resolve('成功的回调');
        reject('失败的回调');
      });

      // 链式调用的原理:then方法的返回值也是一个promise对象,所以可以继续调用then方法
      // promise
      //   .then((res) => {
      //     console.log('第一个then方法', res);
      //     return '第一个then方法的返回值';
      //   })
      //   // 前一个then方法的返回值(如果有的话)会作为下一个then方法的参数传入
      //   .then((res) => {
      //     console.log('第二个then方法', res);
      //     return '第二个then方法的返回值';
      //   })
      //   .then((res) => {
      //     console.log('第三个then方法', res);
      //   })
      //   .catch((err) => {
      //     console.log('error:', err);
      //   });

      // promise.then((res) => {
      //   console.log('添加第二个then方法', res);
      // });

      // then方法传入回调函数的返回值类型
      promise
        .then((res) => {
          console.log('第一个then方法', res);
          // 1.返回一个普通值
          // return '第一个then方法的返回值';

          // 2.返回一个promise对象
          return new Promise((resolve, reject) => {
            setTimeout(() => {
              resolve('第一个then方法的返回值');
            }, 5000);
          });
        })
        // 等待上一个then方法的promise对象决议后才会执行下一个then方法
        .then((res) => {
          console.log('第二个then方法', res);
        });
    </script>
  </body>
</html>
